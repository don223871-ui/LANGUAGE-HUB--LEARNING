<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listening · Drill Down</title><link rel="stylesheet" href="style.css"><style>.wrap{max-width:1120px;margin:auto;padding:28px 20px 150px}.detail{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:28px}.crumb{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}.grid,.micro{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:20px}.sub,.micro a{display:block;text-decoration:none;color:inherit;border:1px solid #e5e7eb;border-radius:15px;padding:17px;background:#fff}.sub:hover,.micro a:hover{transform:translateY(-2px)}.pill{display:inline-block;margin:16px 6px 0 0;padding:9px 14px;border:1px solid #ddd;border-radius:999px;text-decoration:none;color:inherit}.master{font-weight:700}.floating-nav{position:fixed;right:18px;bottom:18px;display:flex;gap:8px;z-index:20}.float-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;text-decoration:none;background:#fff;border:1px solid #ddd;box-shadow:0 6px 20px #0002}.nav-divider{width:1px;height:30px;background:#ccc;margin:auto 2px}.label{display:inline-block;padding:6px 10px;border:1px solid #ddd;border-radius:999px;font-size:.75rem;font-weight:700}</style></head><body><header class="page-hero"><div class="page-hero-inner"><div class="brand-mark">mb</div><p class="eyebrow">LANGUAGE SKILLS · LISTENING</p><h1 id="title">Listening</h1><p class="intro" id="intro">Area → Sub-skill → Micro-skill</p></div></header><main class="wrap"><a class="pill" href="listening.html">← Listening Master Map</a><section id="content" class="detail"></section></main><nav class="floating-nav"><a class="float-btn" href="index.html">mb</a><a class="float-btn" href="index.html">⌂</a><a class="float-btn" href="skills.html">📚</a><a class="float-btn" href="systems.html">⚙️</a><a class="float-btn" href="competence.html">🎯</a><span class="nav-divider"></span><a class="float-btn" href="reading.html">‹</a><a class="float-btn" href="speaking.html">›</a></nav><script>
const areas=[['01','Listening Foundations',['Sound Discrimination','Word Recognition in Speech','Speech Segmentation','Prosodic Awareness']],['02','Literal Comprehension',['Key Fact Retrieval','Instructions & Procedures','Numbers, Names & Data','Explicit Question Answering']],['03','Gist & Main Idea',['Topic Identification','Overall Message','Section Gist','Concise Summarising']],['04','Listening for Detail',['Specific Information','Names, Dates & Events','Examples & Evidence','Precision Listening']],['05','Prediction & Anticipation',['Context Prediction','Lexical Anticipation','Structural Prediction','Speaker-Intention Prediction']],['06','Inference & Implication',['Contextual Inference','Speaker Implication','Attitude Inference','Background-Knowledge Integration']],['07','Vocabulary & Grammar in Speech',['Vocabulary Processing','Grammar Cues','Reduced Forms','Meaning from Prosody']],['08','Organisation & Discourse',['Signposting','Topic Shifts','Sequencing & Relationships','Discourse Markers']],['09','Speaker Purpose & Intention',['Communicative Purpose','Speech Act Recognition','Intention in Interaction','Purpose & Context']],['10','Tone, Attitude & Stance',['Intonation & Emotion','Certainty & Hedging','Approval & Criticism','Tone Interpretation']],['11','Multiple Speakers & Interaction',['Speaker Identification','Turn-Taking','Agreement & Disagreement','Repair & Clarification']],['12','Critical Listening',['Claims & Evidence','Bias & Perspective','Assumptions','Credibility & Consistency']],['13','Note-taking & Synthesis',['Key-word Notes','Idea Mapping','Summarising from Speech','Cross-Source Synthesis']],['14','Real-time Processing',['Selective Attention','Processing Under Speed','Repair Strategies','Ambiguity Tolerance']],['15','Listening Across Contexts',['Formal & Academic Listening','Conversation','Media & Public Speech','Accents & Varieties']],['16','Listening-to-Response Transfer',['Answering','Clarifying & Checking','Discussion & Interaction','Action & Transfer']]];
const q=new URLSearchParams(location.search),areaNo=q.get('area'),skill=q.get('skill');const esc=s=>{const x=document.createElement('div');x.textContent=s;return x.innerHTML};const norm=s=>(s||'').toLowerCase().replace(/^\d+(\.\d+)*\s*/,'').replace(/[^a-z0-9]+/g,'');const area=areas.find(a=>a[0]===areaNo)||areas.find(a=>a[2].some(s=>norm(s)===norm(skill)));const master='https://raw.githubusercontent.com/don223871-ui/LANGUAGE-HUB--LEARNING/main/LISTENING_MICRO_SKILLS_MASTER.md';
function areaView(a){document.getElementById('title').textContent=a[0]+' · '+a[1];document.getElementById('intro').textContent='Listening → Area → Sub-skill → Micro-skill';document.getElementById('content').innerHTML='<div class="crumb">LISTENING · AREA '+a[0]+'</div><h2>'+esc(a[1])+'</h2><p><b>Area purpose:</b> Develop this listening domain as a connected set of teachable abilities. Start with the Sub-skill that you want to study.</p><h3>SUB-SKILLS</h3><div class="grid">'+a[2].map((s,i)=>'<a class="sub" href="listening-area.html?skill='+encodeURIComponent(s)+'"><span class="label">'+a[0]+'.'+(i+1)+'</span><h3>'+esc(s)+'</h3><p>Open → Micro-skills → Detail</p></a>').join('')+'</div><a class="pill master" href="listening-micro-skills.html">Open Full Micro-Skills Map</a>'}
function skillView(a,s){const idx=a[2].indexOf(s);document.getElementById('title').textContent=s;document.getElementById('intro').textContent='Listening → '+a[1]+' → '+s+' → Micro-skills';document.getElementById('content').innerHTML='<div class="crumb">LISTENING · AREA '+a[0]+' · SUB-SKILL '+a[0]+'.'+(idx+1)+'</div><h2>'+esc(a[1])+'</h2><p><b>Area purpose:</b> Develop accurate, flexible listening within this domain and connect perception, comprehension and response.</p><h3>'+a[0]+'.'+(idx+1)+' · '+esc(s)+'</h3><p><b>Sub-skill purpose:</b> A focused listening ability that can be taught, practised, assessed and transferred independently.</p><h3>MICRO-SKILLS</h3><div id="micro" class="micro"><span>Loading Micro-skills…</span></div><a class="pill" href="listening-area.html?area='+a[0]+'">← Back to '+esc(a[1])+'</a><a class="pill master" href="listening-micro-skills.html">Open Full Micro-Skills Map</a>';fetch(master).then(r=>r.text()).then(md=>{const lines=md.split('\n');let active=false,items=[];for(const line of lines){if(line.startsWith('### ')){const heading=line.slice(4);active=norm(heading)===norm(s);continue}if(active&&line.startsWith('- **')){const m=line.match(/^- \*\*(.*?)\*\*\s*[—-]\s*(.*)$/);if(m)items.push(m)}else if(active&&line.startsWith('## '))break}const box=document.getElementById('micro');box.innerHTML=items.length?items.map((m,i)=>'<a href="listening-micro-detail.html?skill='+encodeURIComponent(s)+'&micro='+encodeURIComponent(m[1])+'"><b>MICRO '+(i+1)+' · '+esc(m[1])+'</b><p>'+esc(m[2])+'</p><small>OPEN MICRO-SKILL DETAIL →</small></a>').join(''):'<a href="listening-micro-skills.html"><b>Open Full Micro-Skills Map</b><p>View the complete Listening micro-skill architecture.</p></a>'}).catch(()=>document.getElementById('micro').innerHTML='<a href="listening-micro-skills.html"><b>Open Full Micro-Skills Map</b></a>')}
if(!area){document.getElementById('content').innerHTML='<h2>Listening</h2><p>Please enter through the Listening Master Map.</p>'}else if(skill){skillView(area,skill)}else{areaView(area)}
</script></body></html>
