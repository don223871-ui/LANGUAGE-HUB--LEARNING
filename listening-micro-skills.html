<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listening · Micro-Skills Map</title><link rel="stylesheet" href="style.css"><style>.wrap{max-width:1180px;margin:auto;padding:28px 20px 150px}.area{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;margin:16px 0}.subgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.sub{border:1px solid #e5e7eb;border-radius:14px;padding:14px}.sub a{display:block;text-decoration:none;color:inherit}.sub li{margin:5px 0}.pill{display:inline-block;padding:9px 14px;border:1px solid #ddd;border-radius:999px;text-decoration:none;color:inherit}.floating-nav{position:fixed;right:18px;bottom:18px;display:flex;gap:8px;z-index:20}.float-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;text-decoration:none;background:#fff;border:1px solid #ddd;box-shadow:0 6px 20px #0002}.nav-divider{width:1px;height:30px;background:#ccc;margin:auto 2px}</style></head><body><header class="page-hero"><div class="page-hero-inner"><div class="brand-mark">mb</div><p class="eyebrow">LANGUAGE SKILLS · LISTENING</p><h1>Listening · Full Micro-Skills Map</h1><p class="intro">16 Areas → 64 Sub-skills → 320 Micro-skills</p></div></header><main class="wrap"><a class="pill" href="listening.html">← Listening Master Map</a><div id="map">Loading…</div></main><nav class="floating-nav"><a class="float-btn" href="index.html">mb</a><a class="float-btn" href="index.html">⌂</a><a class="float-btn" href="skills.html">📚</a><a class="float-btn" href="systems.html">⚙️</a><a class="float-btn" href="competence.html">🎯</a><span class="nav-divider"></span><a class="float-btn" href="reading.html">‹</a><a class="float-btn" href="speaking.html">›</a></nav><script>const esc=s=>{const x=document.createElement('div');x.textContent=s;return x.innerHTML};const master='https://raw.githubusercontent.com/don223871-ui/LANGUAGE-HUB--LEARNING/main/LISTENING_MICRO_SKILLS_MASTER.md';fetch(master).then(r=>r.text()).then(md=>{const lines=md.split('\n');let html='',area=null,sub=null;for(const line of lines){if(line.startsWith('## ')){if(area)html+='</div></section>';area=line.slice(3);html+='<section class="area"><h2>'+esc(area)+'</h2><div class="subgrid">'}else if(line.startsWith('### ')){sub=line.slice(4);html+='<div class="sub"><a href="listening-area.html?skill='+encodeURIComponent(sub)+'"><h3>'+esc(sub)+'</h3></a><ul>'}else if(line.startsWith('- **')){const m=line.match(/^- \*\*(.*?)\*\*\s*[—-]\s*(.*)$/);if(m)html+='<li><b>'+esc(m[1])+'</b> — '+esc(m[2])+'</li>'}else if(line.startsWith('## ')){} }if(area)html+='</div></section>';document.getElementById('map').innerHTML=html}).catch(()=>document.getElementById('map').textContent='Unable to load the master map.');</script></body></html>
