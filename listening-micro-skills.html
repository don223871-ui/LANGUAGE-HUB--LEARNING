<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listening · Micro-Skills Map</title><link rel="stylesheet" href="style.css"><style>.wrap{max-width:1180px;margin:auto;padding:28px 20px 150px}.area{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:0;margin:14px 0;overflow:hidden}.area>summary{cursor:pointer;list-style:none;padding:20px 22px;font-weight:800;font-size:1.05rem}.area>summary::-webkit-details-marker{display:none}.area>summary:before{content:'▸';display:inline-block;margin-right:10px;transition:.2s}.area[open]>summary:before{transform:rotate(90deg)}.area-body{padding:0 22px 22px;border-top:1px solid #eee}.sub{border:1px solid #e5e7eb;border-radius:14px;margin:12px 0;overflow:hidden;background:#fff}.sub>summary{cursor:pointer;list-style:none;padding:15px 17px;font-weight:700}.sub>summary::-webkit-details-marker{display:none}.sub>summary:before{content:'▸';display:inline-block;margin-right:9px;transition:.2s}.sub[open]>summary:before{transform:rotate(90deg)}.micro-list{padding:0 17px 15px;margin:0;border-top:1px solid #eee}.micro-list li{margin:10px 0;line-height:1.5}.micro-list a{text-decoration:none;color:inherit}.micro-list a:hover{text-decoration:underline}.pill{display:inline-block;padding:9px 14px;border:1px solid #ddd;border-radius:999px;text-decoration:none;color:inherit}.floating-nav{position:fixed;right:18px;bottom:18px;display:flex;gap:8px;z-index:20}.float-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;text-decoration:none;background:#fff;border:1px solid #ddd;box-shadow:0 6px 20px #0002}.nav-divider{width:1px;height:30px;background:#ccc;margin:auto 2px}</style></head><body><header class="page-hero"><div class="page-hero-inner"><div class="brand-mark">mb</div><p class="eyebrow">LANGUAGE SKILLS · LISTENING</p><h1>Listening · Full Micro-Skills Map</h1><p class="intro">16 Areas → 64 Sub-skills → 320 Micro-skills</p></div></header><main class="wrap"><a class="pill" href="listening.html">← Listening Master Map</a><div id="map"><p>Loading…</p></div></main><nav class="floating-nav"><a class="float-btn" href="index.html">mb</a><a class="float-btn" href="index.html">⌂</a><a class="float-btn" href="skills.html">📚</a><a class="float-btn" href="systems.html">⚙️</a><a class="float-btn" href="competence.html">🎯</a><span class="nav-divider"></span><a class="float-btn" href="reading.html">‹</a><a class="float-btn" href="speaking.html">›</a></nav><script>const esc=s=>{const x=document.createElement('div');x.textContent=s;return x.innerHTML};const master='./LISTENING_MICRO_SKILLS_MASTER.md';fetch(master,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Master map unavailable');return r.text()}).then(md=>{const lines=md.split('\n');let html='',areaOpen=false,subOpen=false,currentSub='';for(const line of lines){if(line.startsWith('## ')){if(subOpen){html+='</ul></details>';subOpen=false}if(areaOpen)html+='</div></details>';const area=line.slice(3).trim();areaOpen=true;html+='<details class="area"><summary>'+esc(area)+'</summary><div class="area-body">'}else if(line.startsWith('### ')){if(subOpen)html+='</ul></details>';currentSub=line.slice(4).trim();subOpen=true;html+='<details class="sub"><summary>'+esc(currentSub)+'</summary><ul class="micro-list">'}else if(line.startsWith('- **')){const m=line.match(/^- \*\*(.*?)\*\*\s*[—-]\s*(.*)$/);if(m)html+='<li><a href="listening-micro-detail.html?skill='+encodeURIComponent(currentSub)+'&micro='+encodeURIComponent(m[1])+'"><b>'+esc(m[1])+'</b> — '+esc(m[2])+'</a></li>'}}if(subOpen)html+='</ul></details>';if(areaOpen)html+='</div></details>';document.getElementById('map').innerHTML=html}).catch(e=>{document.getElementById('map').innerHTML='<p>Unable to load the master map.</p>'})</script></body></html>
