<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading · Drill Down</title><link rel="stylesheet" href="style.css"><style>.wrap{max-width:1050px;margin:auto;padding:28px 20px 150px}.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 5px 18px #0000000a}.card:hover{transform:translateY(-2px)}.detail{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:26px}.micro{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:18px}.micro div{padding:15px;border:1px solid #e5e7eb;border-radius:13px}.micro b{display:block;margin-bottom:6px}.crumb{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}.back,.pill{display:inline-block;margin:12px 6px 0 0;padding:9px 13px;border-radius:999px;border:1px solid #ddd;text-decoration:none;color:inherit}.floating-nav{position:fixed;right:18px;bottom:18px;display:flex;gap:8px;z-index:20}.float-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;text-decoration:none;background:#fff;border:1px solid #ddd;box-shadow:0 6px 20px #0002}.nav-divider{width:1px;height:30px;background:#ccc;margin:auto 2px}</style></head><body><header class="page-hero"><div class="page-hero-inner"><div class="brand-mark">mb</div><p class="eyebrow">LANGUAGE SKILLS · READING</p><h1 id="title">Reading</h1><p class="intro" id="intro">Area → Sub-skill → Micro-skill</p></div></header><main class="wrap"><a class="back" href="reading.html">← Reading Master Map</a><section id="content"></section></main><nav class="floating-nav"><a class="float-btn" href="index.html">mb</a><a class="float-btn" href="index.html">⌂</a><a class="float-btn" href="skills.html">📚</a><a class="float-btn" href="systems.html">⚙️</a><a class="float-btn" href="competence.html">🎯</a><span class="nav-divider"></span><a class="float-btn" href="reading.html">‹</a><a class="float-btn" href="listening.html">›</a></nav><script>
const areas=[['01','Reading Foundations',['Word Recognition','Word Segmentation','Sentence Processing','Reading Fluency']],['02','Literal Comprehension',['Locating Explicit Information','Specific Details','Following Instructions','Matching Information']],['03','Main Idea & Gist',['Topic Identification','Main Idea','Gist Summarising','Paragraph Main Point']],['04','Supporting Details',['Examples & Illustrations','Reasons & Explanations','Evidence & Data','Detail Relevance']],['05','Skimming',['Text Preview','Paragraph Skimming','Structural Skimming','Global Gist']],['06','Scanning',['Target Identification','Keyword & Synonym Search','Number/Name Scanning','Verification']],['07','Vocabulary in Context',['Context Clues','Collocation & Semantic Relations','Word Families','Register & Connotation']],['08','Inference & Implication',['Combining Clues','Meaning Inference','Writer Attitude Inference','Implication','Inference vs Fact']],['09','Reference & Cohesion',['Pronoun Reference','Lexical Reference','Linking Devices','Lexical Cohesion']],['10','Text Organisation',['Paragraph Structure','Text Patterns','Information Flow','Sentence/Paragraph Function']],['11',"Writer's Purpose",['Communicative Purpose','Audience Awareness','Genre Recognition','Purpose & Language Choice']],['12','Tone, Attitude & Stance',['Tone','Attitude','Stance & Certainty','Evaluation']],['13','Fact, Opinion & Claim',['Fact vs Opinion','Claims & Generalisations','Qualification & Limitation','Evidence Status']],['14','Argument & Evidence',['Claim–Reason–Evidence','Counterargument & Concession','Evidence Quality','Argument Structure']],['15','Critical Reading',['Assumptions','Bias & Perspective','Credibility & Reliability','Comparing Sources']],['16','Response & Synthesis',['Summarising','Paraphrasing','Cross-Text Synthesis','Note-taking & Knowledge Building','Transfer to Speaking & Writing']]];
const q=new URLSearchParams(location.search), skill=q.get('skill'), areaNo=q.get('area'), content=document.getElementById('content'); const esc=s=>{const x=document.createElement('div');x.textContent=s;return x.innerHTML}; const norm=s=>(s||'').toLowerCase().replace(/[^a-z0-9]+/g,''); const area=areas.find(a=>a[0]===areaNo)||areas.find(a=>a[2].some(s=>norm(s)===norm(skill)));
function areaView(a){document.getElementById('title').textContent=a[0]+' · '+a[1];document.getElementById('intro').textContent='Reading → Area → choose a Sub-skill → Micro-skills';content.innerHTML='<section class="detail"><div class="crumb">READING · AREA '+a[0]+'</div><h2>'+esc(a[1])+'</h2><p>Choose a Sub-skill. Every card below is now a real clickable drill-down.</p>'+a[2].map((s,i)=>'<a class="card" href="reading-area.html?skill='+encodeURIComponent(s)+'"><b>'+a[0]+'.'+(i+1)+'</b><h3>'+esc(s)+'</h3><p>Open → Micro-skills → Learning detail</p></a>').join('')+'</section>'}
function skillView(a,s){const idx=a[2].indexOf(s);document.getElementById('title').textContent=s;document.getElementById('intro').textContent='Reading → '+a[1]+' → '+s+' → Micro-skills';content.innerHTML='<section class="detail"><div class="crumb">READING · AREA '+a[0]+' · SUB-SKILL '+a[0]+'.'+(idx+1)+'</div><h2>'+esc(s)+'</h2><p>This Sub-skill is now an active learning layer. The Micro-skills below are the teachable abilities inside it.</p><div id="micro" class="micro"><div><b>Loading…</b><span>Reading the master architecture.</span></div></div><a class="pill" href="reading-area.html?area='+a[0]+'">← Back to '+esc(a[1])+'</a><a class="pill" href="reading-micro-skills.html">Open Full Micro-Skills Map</a></section>';fetch('https://raw.githubusercontent.com/don223871-ui/LANGUAGE-HUB--LEARNING/main/READING_MICRO_SKILLS_MASTER.md').then(r=>r.text()).then(md=>{const lines=md.split('\n');let active=false,items=[];for(const line of lines){if(line.startsWith('## ')){active=norm(line.slice(3))===norm(s);continue}if(active&&line.startsWith('- **')){const m=line.match(/^- \*\*(.*?)\*\*\s*[—-]\s*(.*)$/);if(m)items.push(m)}else if(active&&line.startsWith('# '))break}const box=document.getElementById('micro');box.innerHTML=items.length?items.map((m,i)=>'<div><b>'+esc(m[1])+'</b><span>'+esc(m[2])+'</span><br><small>MICRO-SKILL '+(i+1)+'</small></div>').join(''):'<div><b>Micro-skill layer ready</b><span>No parsed items were found for this exact label yet.</span></div>'}).catch(()=>document.getElementById('micro').innerHTML='<div><b>Micro-skill layer</b><span>Open the master map.</span></div>')}
if(!area){content.innerHTML='<section class="detail"><h2>Reading</h2><p>Please enter through the Reading Master Map.</p></section>'}else if(skill){skillView(area,skill)}else{areaView(area)}
</script></body></html>
