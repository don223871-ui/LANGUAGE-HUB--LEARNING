<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading · Area & Sub-skill</title><link rel="stylesheet" href="style.css"><style>.wrap{max-width:1050px;margin:auto;padding:28px 20px 150px}.cards{display:grid;gap:14px}.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;box-shadow:0 5px 18px #0000000a}.card:hover{transform:translateY(-2px)}.detail{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:26px;margin-top:18px}.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.detail-box{border:1px solid #e5e7eb;border-radius:14px;padding:15px}.detail-box h4{margin:0 0 7px}.crumb{font-size:.82rem;letter-spacing:.08em;text-transform:uppercase}.back{display:inline-block;margin:12px 0;padding:10px 14px;border-radius:999px;border:1px solid #ddd;text-decoration:none;color:inherit}.subnav{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.pill{padding:9px 12px;border:1px solid #ddd;border-radius:999px;text-decoration:none;color:inherit}.area-intro{margin-bottom:20px}.empty{padding:30px;text-align:center}</style></head><body><header class="page-hero"><div class="page-hero-inner"><div class="brand-mark">mb</div><p class="eyebrow">LANGUAGE SKILLS · READING</p><h1 id="title">Reading</h1><p class="intro" id="intro">Choose one layer at a time: Area → Sub-skill → Learning details.</p></div></header><main class="wrap"><a class="back" href="reading.html">← Back to Reading Master Map</a><section id="content"></section></main><nav class="floating-nav"><a class="float-btn logo-btn" href="index.html">mb</a><a class="float-btn" href="index.html">⌂</a><a class="float-btn" href="skills.html">📚</a><a class="float-btn" href="systems.html">⚙️</a><a class="float-btn" href="competence.html">🎯</a><span class="nav-divider"></span><a class="float-btn" href="reading.html">‹</a><a class="float-btn" id="next" href="listening.html">›</a></nav><script>
const A=[
['01','Reading Foundations','Build the basic processes that make written language accessible.',['Word Recognition','Word Segmentation','Sentence Processing','Reading Fluency']],
['02','Literal Comprehension','Understand information directly stated in the text.',['Locating Explicit Information','Specific Details','Following Instructions','Matching Information']],
['03','Main Idea & Gist','Recognise the central message of a text or section.',['Topic Identification','Main Idea','Gist Summarising','Paragraph Main Point']],
['04','Supporting Details','Understand how examples, reasons and evidence develop ideas.',['Examples & Illustrations','Reasons & Explanations','Evidence & Data','Detail Relevance']],
['05','Skimming','Read selectively and rapidly for overall meaning and structure.',['Text Preview','Paragraph Skimming','Structural Skimming','Global Gist']],
['06','Scanning','Search efficiently for specific information.',['Target Identification','Keyword & Synonym Search','Number/Name Scanning','Verification']],
['07','Vocabulary in Context','Construct word meaning from context and lexical relationships.',['Context Clues','Collocation & Semantic Relations','Word Families','Register & Connotation']],
['08','Inference & Implication','Construct meanings that are suggested rather than directly stated.',['Combining Clues','Meaning Inference','Writer Attitude Inference','Implication','Inference vs Fact']],
['09','Reference & Cohesion','Track connections between language items and ideas.',['Pronoun Reference','Lexical Reference','Linking Devices','Lexical Cohesion']],
['10','Text Organisation','Understand how information is structured and developed.',['Paragraph Structure','Text Patterns','Information Flow','Sentence/Paragraph Function']],
['11',"Writer's Purpose",'Connect textual choices with communicative goals and audience.',['Communicative Purpose','Audience Awareness','Genre Recognition','Purpose & Language Choice']],
['12','Tone, Attitude & Stance','Interpret evaluation, emotion, certainty and writer position.',['Tone','Attitude','Stance & Certainty','Evaluation']],
['13','Fact, Opinion & Claim','Distinguish information types, claims and degrees of certainty.',['Fact vs Opinion','Claims & Generalisations','Qualification & Limitation','Evidence Status']],
['14','Argument & Evidence','Reconstruct reasoning and judge how claims are supported.',['Claim–Reason–Evidence','Counterargument & Concession','Evidence Quality','Argument Structure']],
['15','Critical Reading','Evaluate assumptions, perspective, reliability and competing sources.',['Assumptions','Bias & Perspective','Credibility & Reliability','Comparing Sources']],
['16','Response & Synthesis','Transform reading into organised knowledge and productive language.',['Summarising','Paraphrasing','Cross-Text Synthesis','Note-taking & Knowledge Building','Transfer to Speaking & Writing']]
];
const D={
'Word Recognition':['Recognising written words quickly and accurately.','orthographic patterns, word forms and automatic access to familiar vocabulary.','Identify words without sounding out every letter; notice prefixes, suffixes and familiar chunks.','High-frequency word recognition, repeated reading and timed word/phrase tasks.','Faster lexical access, fewer pauses and more attention available for meaning.'],
'Word Segmentation':['Identifying boundaries between words and meaningful written units.','spacing, word boundaries and multiword units.','Separate continuous text into meaningful lexical units.','Phrase marking, segmentation and chunking exercises.','More efficient processing of connected text.'],
'Sentence Processing':['Building sentence meaning from vocabulary and grammar.','word order, clause relationships, subjects, objects, modifiers and logical relations.','Answer who-did-what-to-whom questions and reconstruct sentence meaning.','Sentence ordering, matching, paraphrase and clause-mapping tasks.','Accurate sentence-level comprehension.'],
'Reading Fluency':['Reading connected text accurately, smoothly and efficiently.','automaticity, phrasing, pacing and attention control.','Maintain meaning while increasing reading efficiency.','Repeated reading, paced reading and phrase-grouping practice.','Greater speed without sacrificing comprehension.'],
'Locating Explicit Information':['Finding information that is directly stated.','question types, textual signals and location cues.','Locate the exact passage that answers a question.','Who/what/where/when/which retrieval tasks.','Reliable retrieval of explicit information.'],
'Specific Details':['Recognising relevant facts, examples, numbers and descriptions.','detail types and relevance.','Separate required details from distractors.','Detail-selection and evidence-location tasks.','Accurate evidence retrieval.'],
'Following Instructions':['Understanding written directions and ordered actions.','imperatives, sequencing, conditions and constraints.','Carry out or explain the required steps.','Procedure and process-text tasks.','Correct action based on written input.'],
'Matching Information':['Connecting questions, statements or headings with the correct text location.','paraphrase recognition and information matching.','Compare meaning rather than relying on identical words.','Matching and distractor exercises.','Flexible information-location skill.'],
'Topic Identification':['Identifying what a text or paragraph is about.','topic versus supporting detail.','Name the subject concisely.','Heading and topic-choice tasks.','Fast orientation to content.'],
'Main Idea':['Identifying the central proposition of a passage.','centrality, relevance and supporting-detail distinction.','State the key message in one clear sentence.','Best-main-idea and elimination tasks.','Accurate central-meaning recognition.'],
'Gist Summarising':['Compressing a passage to its essential message.','selection, omission and concise reformulation.','Keep the central message and remove minor detail.','One-sentence and word-limit summaries.','Global comprehension and concise processing.'],
'Paragraph Main Point':['Identifying the controlling idea of a paragraph.','topic sentence, development and conclusion.','Explain what the paragraph contributes to the text.','Paragraph-title and main-point tasks.','Stronger paragraph-level comprehension.'],
'Examples & Illustrations':['Recognising examples that clarify or prove an idea.','example signals and example-to-claim relationships.','Connect an example to the idea it illustrates.','Evidence matching and paragraph annotation.','Clearer understanding of development.'],
'Reasons & Explanations':['Identifying why something happens or how something works.','cause, reason, explanation and result signals.','Map an explanation to the idea it supports.','Reason-detail matching and cause-effect tasks.','Deeper comprehension of logic.'],
'Evidence & Data':['Understanding facts, figures and data used as support.','data language, quantities and evidential relevance.','Connect data to the claim it supports.','Data-to-claim and evidence-selection tasks.','Evidence-aware reading.'],
'Detail Relevance':['Deciding whether a detail matters to the question or main idea.','relevance, redundancy and distractors.','Ignore attractive but irrelevant information.','Timed relevance and distractor tasks.','More accurate and efficient comprehension.'],
'Text Preview':['Using title, headings, layout and opening lines to predict content.','textual signals and prediction.','Form an initial hypothesis before close reading.','Timed previews followed by prediction checks.','Faster orientation and better expectations.'],
'Paragraph Skimming':['Rapidly identifying paragraph purpose and main point.','topic sentences, repeated concepts and paragraph endings.','Extract paragraph gist without reading every word.','Timed heading and paragraph-summary tasks.','Efficient global reading.'],
'Structural Skimming':['Seeing the organisation of a text quickly.','sections, headings, transitions and discourse patterns.','Build a mental outline from a rapid pass.','Outline-from-skim and structure mapping.','Strategic reading control.'],
'Global Gist':['Constructing an overall understanding after limited reading.','text purpose, topic, major points and conclusion.','Explain the text in broad terms before detailed analysis.','Timed gist followed by verification.','Efficient whole-text comprehension.'],
'Target Identification':['Defining exactly what information must be found.','question keywords and target types.','Set a precise search target before scanning.','Target-spotting tasks.','Focused information search.'],
'Keyword & Synonym Search':['Finding ideas even when the text uses different wording.','paraphrase, synonymy and word-family relationships.','Search conceptually rather than only for exact words.','Question-to-text paraphrase matching.','Flexible retrieval.'],
'Number/Name Scanning':['Rapidly locating distinctive names, dates, figures and labels.','visual salience and numerical/name patterns.','Jump to likely locations efficiently.','Timed data and name-location tasks.','Fast retrieval of discrete information.'],
'Verification':['Checking that a located detail actually answers the question.','context checking and distractor detection.','Read around the target and confirm meaning.','False-match and distractor exercises.','Fewer retrieval errors.'],
'Context Clues':['Inferring unfamiliar word meaning from nearby information.','definition, example, contrast, cause and consequence clues.','Generate and test a plausible meaning.','Unknown-word inference tasks.','Greater lexical independence.'],
'Collocation & Semantic Relations':['Using surrounding words and semantic relationships to narrow meaning.','collocations, synonyms, antonyms and semantic fields.','Use co-text to select the intended sense.','Context-choice and collocation tasks.','More precise contextual interpretation.'],
'Word Families':['Using morphology to recognise relationships between related words.','roots, prefixes, suffixes and grammatical word forms.','Identify how form changes meaning and function.','Word-family tables and contextual transformations.','Stronger lexical flexibility.'],
'Register & Connotation':['Interpreting social, emotional and stylistic associations of words.','formal/informal register and positive/negative connotation.','Explain why a writer selected a particular word.','Register comparison and substitution tasks.','More nuanced reading.'],
'Combining Clues':['Combining separate textual clues to construct an unstated meaning.','evidence integration and inference chains.','Connect clues logically before deciding.','Multi-clue inference tasks.','Supported interpretation.'],
'Meaning Inference':['Inferring a proposition that is not explicitly stated.','logical relations and evidence thresholds.','State the inferred meaning and cite textual support.','Inference questions with evidence justification.','Higher-level comprehension.'],
'Writer Attitude Inference':['Inferring attitude from evaluative language and textual choices.','stance clues, adjectives, verbs and framing.','Identify attitude and explain the evidence.','Attitude classification and justification.','Justified interpretation of viewpoint.'],
'Implication':['Understanding what a writer suggests without directly saying it.','indirect meaning and pragmatic relationships.','Explain the implied message without over-interpreting.','Explicit-versus-implied tasks.','More sophisticated comprehension.'],
'Inference vs Fact':['Separating what the text states from what the reader concludes.','explicit evidence and inference thresholds.','Label statements as explicit, inferred or unsupported.','Evidence-justification sorting.','Disciplined interpretation.'],
'Pronoun Reference':['Identifying what pronouns and referring expressions point to.','antecedents, agreement and reference chains.','Track entities across sentences.','Reference questions and chain highlighting.','Fewer comprehension breaks.'],
'Lexical Reference':['Following concepts through repeated or related vocabulary.','synonymy, repetition and semantic reference.','Recognise when different words refer to the same concept.','Lexical-chain mapping.','Stronger cohesion awareness.'],
'Linking Devices':['Interpreting words that signal relationships between ideas.','contrast, cause, addition, result, condition and concession markers.','Identify the logical relationship signalled.','Connector matching and paragraph reconstruction.','Clearer discourse understanding.'],
'Lexical Cohesion':['Following semantic links across a whole text.','repetition, synonymy, collocation and semantic chains.','Track a concept as vocabulary changes.','Concept-chain annotation.','Stronger global coherence recognition.'],
'Paragraph Structure':['Understanding how a paragraph introduces and develops an idea.','topic, support, example, explanation and conclusion moves.','Map the role of each sentence.','Sentence-function labelling and ordering.','Structural comprehension.'],
'Text Patterns':['Recognising common ways texts organise information.','cause-effect, problem-solution, compare-contrast and chronology.','Identify the pattern controlling development.','Pattern labelling and outline tasks.','Predictable navigation through complex texts.'],
'Information Flow':['Tracking how known and new information develops.','topic progression, thematic development and transitions.','Explain how one idea leads to another.','Paragraph mapping and flow diagrams.','Coherent whole-text understanding.'],
'Sentence/Paragraph Function':['Identifying what a sentence or paragraph is doing in context.','functions such as introduce, explain, contrast, exemplify and conclude.','Describe function rather than only content.','Function-matching tasks.','Better understanding of discourse structure.'],
'Communicative Purpose':['Identifying what the writer is trying to accomplish.','inform, explain, describe, argue, persuade, evaluate and entertain.','State the dominant purpose and supporting signals.','Genre-purpose matching.','Purpose-aware reading.'],
'Audience Awareness':['Inferring who the text is designed for.','audience assumptions, vocabulary, tone and background knowledge.','Connect language choices to readership.','Audience comparison tasks.','Better interpretation of textual choices.'],
'Genre Recognition':['Recognising the type of text and its conventional expectations.','genre features, structure and communicative conventions.','Predict likely organisation and purpose.','Genre identification and comparison.','Faster strategic reading.'],
'Purpose & Language Choice':['Connecting wording and structure to communicative goals.','register, emphasis, selection and framing.','Explain why a choice helps achieve the purpose.','Purpose-to-language annotation.','More precise interpretation.'],
'Tone':['Identifying the overall emotional or communicative quality of writing.','neutral, critical, enthusiastic, cautious and other tonal patterns.','Label tone and cite textual clues.','Tone comparison and evidence tasks.','Sensitive interpretation.'],
'Attitude':['Identifying approval, criticism, concern, doubt or other writer reactions.','evaluative language and stance markers.','Separate attitude from topic.','Attitude highlighting and comparison.','Clearer writer-position reading.'],
'Stance & Certainty':['Interpreting how strongly the writer commits to a proposition.','hedging, modality, boosters and probability.','Judge certainty level accurately.','Certainty scales and wording comparison.','Accurate claim interpretation.'],
'Evaluation':['Recognising value judgements and what the writer treats as good, bad, useful or problematic.','evaluative vocabulary and framing.','Identify what is being valued or criticised.','Evaluation annotation.','Clearer understanding of writer position.'],
'Fact vs Opinion':['Distinguishing verifiable information from belief or evaluation.','verification, evidence and subjectivity.','Classify statements cautiously.','Fact/opinion sorting with justification.','More critical interpretation.'],
'Claims & Generalisations':['Identifying propositions presented as conclusions or broad statements.','claim scope and generalisation.','Extract and restate claims precisely.','Claim-identification tasks.','Clearer argument mapping.'],
'Qualification & Limitation':['Noticing language that narrows or conditions a claim.','may, often, tends to, some, generally and similar qualifiers.','Interpret the exact strength and scope.','Qualifier analysis and rewriting.','Avoidance of overgeneralisation.'],
'Evidence Status':['Distinguishing supported claims from assertions.','citation, data, examples and evidential support.','Ask what evidence is actually present.','Claim-support checking.','More disciplined reading.'],
'Claim–Reason–Evidence':['Reconstructing the basic logic of an argument.','roles of claim, reason and evidence.','Map support relationships.','Argument diagrams and annotation.','Structural argument comprehension.'],
'Counterargument & Concession':['Recognising alternative positions and the writer’s response.','concession, contrast and rebuttal signals.','Identify opposing view and response.','Counterargument mapping.','Sophisticated persuasion reading.'],
'Evidence Quality':['Judging relevance, sufficiency and credibility of support.','evidence strength and source quality.','Evaluate evidence against a claim.','Evidence-ranking tasks.','Evidence-aware judgement.'],
'Argument Structure':['Following a multi-step line of reasoning from premises to conclusion.','premises, intermediate claims and conclusions.','Reconstruct the argument in order.','Argument mapping and reconstruction.','Independent reasoning comprehension.'],
'Assumptions':['Identifying ideas an argument relies on without fully stating.','implicit premises and background assumptions.','Ask what must be true for the argument to work.','Assumption-spotting tasks.','Deeper independent evaluation.'],
'Bias & Perspective':['Recognising how viewpoint shapes selection and framing.','selection, omission, framing and perspective.','Compare how another viewpoint might frame the issue.','Paired-text bias tasks.','More balanced interpretation.'],
'Credibility & Reliability':['Evaluating whether information deserves confidence.','source, evidence, consistency and transparency.','Test claims against available support.','Source-evaluation checklists.','Independent critical judgement.'],
'Comparing Sources':['Comparing how different texts represent the same issue.','agreement, contradiction, emphasis and omission.','Build a structured cross-source comparison.','Paired-source analysis.','Synthesis-ready reading.'],
'Summarising':['Compressing important information without changing its meaning.','main ideas, selection, omission and compression.','Produce a concise faithful summary.','Progressive word-limit summaries.','Transferable comprehension.'],
'Paraphrasing':['Restating meaning using different language and structure.','synonymy, grammatical transformation and restructuring.','Change form while preserving meaning.','Sentence-to-paragraph paraphrase tasks.','Flexible language use.'],
'Cross-Text Synthesis':['Combining information from multiple sources into one coherent understanding.','agreement, contrast and complementary evidence.','Integrate ideas rather than listing them separately.','Synthesis notes and comparative writing.','Multi-source comprehension.'],
'Note-taking & Knowledge Building':['Turning reading into organised reusable knowledge.','selection, categorisation, hierarchy and connections.','Build structured notes and concept maps.','Outline, Cornell-style and concept-map practice.','Reading becomes durable knowledge.'],
'Transfer to Speaking & Writing':['Using reading input as a basis for independent production.','evidence use, vocabulary transfer, idea development and source attribution.','Discuss, argue or write using what was read.','Read-to-speak and read-to-write tasks.','Reading directly strengthens productive skills.']};
function detail(id,name){let d=D[name]||[name+' is a Reading sub-skill.','the knowledge and strategies needed to perform it accurately.','apply the skill to authentic text and explain the evidence.','guided practice followed by independent performance.','independent, accurate and transferable Reading performance.'];return `<div class="detail"><p class="crumb">SUB-SKILL · ${id}</p><h2>${name}</h2><p>${d[0]}</p><div class="detail-grid"><div class="detail-box"><h4>WHAT YOU LEARN</h4><p>${d[1]}</p></div><div class="detail-box"><h4>WHAT YOU DO</h4><p>${d[2]}</p></div><div class="detail-box"><h4>HOW YOU PRACTISE</h4><p>${d[3]}</p></div><div class="detail-box"><h4>COMMON CHECK</h4><p>Can you perform the task accurately, explain why your answer is supported by the text, and repeat the skill independently?</p></div><div class="detail-box"><h4>TRANSFER</h4><p>Use the skill with unfamiliar texts, then transfer the result into vocabulary, speaking, writing, note-taking or critical analysis.</p></div><div class="detail-box"><h4>FINAL OUTCOME</h4><p>${d[4]}</p></div></div></div>`}
function render(){let p=new URLSearchParams(location.search),area=p.get('area'),skill=p.get('skill');if(skill){let a=A.flatMap(x=>x[3].map((s,i)=>({a:x[0],name:s,id:x[0]+'.'+(i+1)}))).find(x=>x.name===skill);document.title=skill+' · Reading';document.getElementById('title').textContent=skill;document.getElementById('intro').textContent='One layer deeper: understand, practise, assess and transfer this Reading sub-skill.';document.getElementById('content').innerHTML=detail(a?.id||'',skill)+`<div class="subnav"><a class="pill" href="reading-area.html?area=${a?.a}">← Back to Area</a><a class="pill" href="reading.html">Reading Master Map</a></div>`;return}let x=A.find(a=>a[0]===area);if(!x){document.getElementById('content').innerHTML='<div class="empty">Choose an area from the Reading Master Map.</div>';return}document.getElementById('title').textContent=x[0]+' · '+x[1];document.getElementById('intro').textContent=x[2];document.getElementById('content').innerHTML='<section class="area-intro learning-map"><span class="section-kicker">LAYER 02 · SUB-SKILLS</span><h2>Reading → '+x[1]+' → Choose a Sub-skill</h2><p>Each card opens the next layer. Do not jump ahead: first understand the area, then the sub-skill, then its learning details.</p></section><section class="cards">'+x[3].map((s,i)=>`<a class="card" href="reading-area.html?skill=${encodeURIComponent(s)}"><small>${x[0]}.${i+1}</small><h2>${s}</h2><p>${D[s]?.[0]||''}</p><strong>OPEN SUB-SKILL →</strong></a>`).join('')+'</section>'}render();</script><footer><p>LANGUAGE HUB · LEARNING</p><span>Reading · Area → Sub-skill → Learning Detail</span></footer></body></html>
