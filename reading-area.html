<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading · Learning Architecture</title><link rel="stylesheet" href="style.css"><style>.wrap{max-width:1050px;margin:auto;padding:28px 20px 150px}.detail,.context{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:26px;margin-bottom:16px}.card,.micro-card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin:12px 0}.card:hover,.micro-card:hover{transform:translateY(-2px)}.badge{display:inline-block;font-size:.72rem;letter-spacing:.08em;font-weight:800;padding:6px 10px;border-radius:999px;border:1px solid #ddd;margin-bottom:10px}.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:20px 0}.info div{padding:15px;border:1px solid #e5e7eb;border-radius:14px}.info b{display:block;margin-bottom:6px}.micro{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.micro-card{margin:0}.crumb{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}.pill,.master-link{display:inline-block;margin:10px 6px 0 0;padding:9px 14px;border-radius:999px;border:1px solid #ddd;text-decoration:none;color:inherit;font-weight:700}.floating-nav{position:fixed;right:18px;bottom:18px;display:flex;gap:8px;z-index:20}.float-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;text-decoration:none;background:#fff;border:1px solid #ddd;box-shadow:0 6px 20px #0002}.nav-divider{width:1px;height:30px;background:#ccc;margin:auto 2px}.note{line-height:1.75}</style></head><body><header class="page-hero"><div class="page-hero-inner"><div class="brand-mark">mb</div><p class="eyebrow">LANGUAGE SKILLS · READING</p><h1 id="title">Reading</h1><p class="intro" id="intro">Area → Sub-skill → Micro-skill</p></div></header><main class="wrap"><a class="pill" href="reading.html">← Reading Master Map</a><section id="content"></section></main><nav class="floating-nav"><a class="float-btn" href="index.html">mb</a><a class="float-btn" href="index.html">⌂</a><a class="float-btn" href="skills.html">📚</a><a class="float-btn" href="systems.html">⚙️</a><a class="float-btn" href="competence.html">🎯</a><span class="nav-divider"></span><a class="float-btn" href="reading.html">‹</a><a class="float-btn" href="listening.html">›</a></nav><script>
const A=[['01','Reading Foundations',['Word Recognition','Word Segmentation','Sentence Processing','Reading Fluency'],'Build the lower-level processes that make written language accessible, accurate and increasingly automatic.'],['02','Literal Comprehension',['Locating Explicit Information','Specific Details','Following Instructions','Matching Information'],'Understand information that is directly stated and retrieve it accurately from the text.'],['03','Main Idea & Gist',['Topic Identification','Main Idea','Gist Summarising','Paragraph Main Point'],'Identify what a text or paragraph is mainly about and condense its central meaning.'],['04','Supporting Details',['Examples & Illustrations','Reasons & Explanations','Evidence & Data','Detail Relevance'],'Understand how details develop, explain, illustrate and support larger ideas.'],['05','Skimming',['Text Preview','Paragraph Skimming','Structural Skimming','Global Gist'],'Read selectively and rapidly to establish purpose, structure and overall meaning.'],['06','Scanning',['Target Identification','Keyword & Synonym Search','Number/Name Scanning','Verification'],'Search efficiently for specific information without reading every word.'],['07','Vocabulary in Context',['Context Clues','Collocation & Semantic Relations','Word Families','Register & Connotation'],'Construct vocabulary meaning from surrounding language, relationships and discourse context.'],['08','Inference & Implication',['Combining Clues','Meaning Inference','Writer Attitude Inference','Implication','Inference vs Fact'],'Construct meanings that are suggested rather than directly stated while remaining evidence-based.'],['09','Reference & Cohesion',['Pronoun Reference','Lexical Reference','Linking Devices','Lexical Cohesion'],'Track how references, repeated vocabulary and connectors create continuity across a text.'],['10','Text Organisation',['Paragraph Structure','Text Patterns','Information Flow','Sentence/Paragraph Function'],'Understand how writers arrange information and how each part contributes to the whole.'],['11',"Writer's Purpose",['Communicative Purpose','Audience Awareness','Genre Recognition','Purpose & Language Choice'],'Connect textual choices with the writer’s communicative goal and intended reader.'],['12','Tone, Attitude & Stance',['Tone','Attitude','Stance & Certainty','Evaluation'],'Interpret how writers signal emotion, evaluation, certainty, distance and position.'],['13','Fact, Opinion & Claim',['Fact vs Opinion','Claims & Generalisations','Qualification & Limitation','Evidence Status'],'Distinguish statement types and judge what a text actually establishes.'],['14','Argument & Evidence',['Claim–Reason–Evidence','Counterargument & Concession','Evidence Quality','Argument Structure'],'Reconstruct reasoning and evaluate how claims are supported, qualified or challenged.'],['15','Critical Reading',['Assumptions','Bias & Perspective','Credibility & Reliability','Comparing Sources'],'Evaluate texts by examining assumptions, evidence, perspective, bias and reliability.'],['16','Response & Synthesis',['Summarising','Paraphrasing','Cross-Text Synthesis','Note-taking & Knowledge Building','Transfer to Speaking & Writing'],'Transform reading input into organised understanding and transferable language production.']];
const D={
'Word Recognition':['Recognise written words accurately and increasingly automatically.','Fast access to word forms frees attention for meaning.','Notice spelling, morphology, word families and multiword units.','Accurate automatic recognition.'],'Word Segmentation':['Identify boundaries between written words and meaningful units.','Clear boundaries support accurate parsing.','Mark boundaries and confirm them through syntax and morphology.','More accurate parsing.'],'Sentence Processing':['Construct meaning by recognising grammatical relationships inside a sentence.','Local processing supports global comprehension.','Identify clauses, subjects, verbs, objects, modifiers and logical relations.','Accurate sentence interpretation.'],'Reading Fluency':['Read connected text with accuracy, pace, phrasing and attention to meaning.','Fluency reduces unnecessary cognitive load.','Practise phrase grouping, pacing and repeated meaningful reading.','Smoother, meaning-focused reading.'],'Locating Explicit Information':['Find information directly stated by the writer.','It supports reliable retrieval.','Identify the target, locate its textual match and verify context.','Accurate explicit retrieval.'],'Specific Details':['Identify precise facts, examples, numbers, names, reasons or conditions.','Detail accuracy matters when one exact item controls the task.','Search for targets, reject distractors and verify context.','Reliable detail extraction.'],'Following Instructions':['Understand and follow written directions, sequences, conditions and constraints.','Reading sometimes leads directly to action.','Identify actions, order, conditions, exceptions and required outputs.','Correct task completion.'],'Matching Information':['Connect questions or statements with the correct part of a text.','It develops meaning-based retrieval beyond word matching.','Compare paraphrase, synonyms and discourse context.','Accurate matching.'],'Topic Identification':['Identify what a sentence, paragraph or text is about.','Topic recognition anchors later interpretation.','Track repeated concepts and separate topic from detail.','Clear topic identification.'],'Main Idea':['Identify the central message or controlling point.','It prevents over-focusing on details.','Compare candidate ideas with the whole text and reject narrow or broad distractors.','Accurate central meaning.'],'Gist Summarising':['Condense overall meaning without unnecessary detail.','Gist supports efficient reading and synthesis.','Combine topic, main point and key development.','Faithful concise gist.'],'Paragraph Main Point':['Identify what a paragraph contributes to the text.','Paragraph control makes longer texts navigable.','Notice topic, development, examples, contrast and conclusion.','Clear paragraph purpose.'],'Examples & Illustrations':['Recognise examples and what they demonstrate.','Examples usually support a broader idea.','Connect each example to the idea it illustrates.','Accurate support interpretation.'],'Reasons & Explanations':['Identify why something happens or how a claim is explained.','Explanatory relations organise logical meaning.','Track cause, reason, explanation and consequence signals.','Reliable explanation recognition.'],'Evidence & Data':['Interpret facts, statistics, quotations and other supporting evidence.','Evidence affects claim strength.','Identify what evidence shows, supports and does not prove.','Precise evidence comprehension.'],'Detail Relevance':['Judge whether a detail is relevant to the point being discussed.','This prevents distractors controlling interpretation.','Connect details to paragraph purpose and central claims.','Better relevance judgement.'],'Skimming':['Read selectively to establish overall meaning and structure quickly.','It improves reading efficiency.','Preview titles, headings, openings, paragraph shape and key signals.','Fast text orientation.'],'Scanning':['Search efficiently for a specific piece of information.','It saves time when the target is known.','Predict forms, search keywords and synonyms, then verify context.','Fast accurate retrieval.'],'Context Clues':['Use surrounding language to infer unfamiliar vocabulary.','It develops independent reading.','Use definition, example, contrast, cause, grammar and semantic clues.','Confident context inference.'],'Combining Clues':['Combine multiple textual clues to construct a supported interpretation.','Meaning often emerges across sentences.','Collect relevant clues and test whether they converge.','Evidence-based inference.'],'Meaning Inference':['Infer unstated meaning from textual evidence.','Authentic reading frequently requires interpretation.','Combine wording, context and logical relationships.','Supported implied meaning.'],'Writer Attitude Inference':['Infer how the writer feels or positions themselves.','Attitude affects interpretation of claims and tone.','Track evaluation, modality, lexical choice and framing.','Evidence-based attitude interpretation.'],'Implication':['Recognise what a statement suggests beyond its literal wording.','Implication is central to authentic comprehension.','Ask what logically follows without adding unsupported assumptions.','Accurate implied meaning.'],'Inference vs Fact':['Distinguish evidence-supported inference from directly stated fact.','This prevents over-reading.','Label what is stated, inferred and merely possible.','Better evidence discipline.'],'Pronoun Reference':['Identify what pronouns and referring expressions point to.','Reference tracking is essential for cohesion.','Trace grammatical agreement and discourse candidates.','Accurate reference resolution.'],'Lexical Reference':['Track repeated or related words that refer back to the same idea.','Lexical cohesion links text across sentences.','Follow repetition, synonymy and lexical chains.','Clear lexical tracking.'],'Linking Devices':['Interpret connectors that signal logical relationships.','Connectors reveal how ideas relate.','Identify contrast, cause, addition, condition, concession and result.','Accurate relation interpretation.'],'Lexical Cohesion':['See how vocabulary choices connect parts of a text.','Cohesion supports global comprehension.','Track repetition, synonymy, collocation and semantic fields.','Stronger text continuity awareness.'],'Paragraph Structure':['Recognise how a paragraph opens, develops and closes an idea.','Structure helps predict information.','Identify topic, development, evidence, contrast and conclusion.','Structural awareness.'],'Text Patterns':['Recognise common organisational patterns such as cause-effect, comparison and problem-solution.','Patterns guide expectations while reading.','Identify the dominant relationship organising information.','Faster structural comprehension.'],'Information Flow':['Track how information moves from known to new and from claim to support.','Flow explains why sentences appear in a particular order.','Follow topic continuity and shifts in focus.','Better discourse tracking.'],'Sentence/Paragraph Function':['Identify what a sentence or paragraph does in the text.','Function connects local language to global purpose.','Classify statements as claim, reason, example, contrast, result, definition and so on.','Clear functional reading.'],'Communicative Purpose':['Identify what the writer is trying to achieve.','Purpose explains many textual choices.','Use claims, organisation, genre and audience cues.','Accurate purpose interpretation.'],'Audience Awareness':['Infer who the text is designed for and what that audience may need.','Audience shapes vocabulary, explanation and tone.','Use register, assumed knowledge and content selection as clues.','Better audience-sensitive reading.'],'Genre Recognition':['Recognise the type and communicative conventions of a text.','Genre provides expectations about structure and purpose.','Notice format, organisation, language and conventional moves.','Reliable genre recognition.'],'Purpose & Language Choice':['Connect language choices with communicative purpose.','Writers select forms strategically.','Relate modality, vocabulary, tone and structure to purpose.','Functional interpretation.'],'Tone':['Recognise the emotional or evaluative quality of language.','Tone changes how information should be interpreted.','Notice evaluative vocabulary, modality, intensity and framing.','Accurate tone interpretation.'],'Attitude':['Identify the writer’s positive, negative, neutral or mixed position.','Attitude affects how claims are framed.','Track evaluative language and repeated positioning.','Reliable attitude interpretation.'],'Stance & Certainty':['Interpret how strongly the writer commits to a proposition.','Certainty affects claim strength.','Notice modal verbs, adverbs, hedging and boosters.','Accurate stance reading.'],'Evaluation':['Recognise language that judges people, ideas, evidence or events.','Evaluation reveals position and values.','Separate descriptive content from evaluative judgement.','Clear evaluation awareness.'],'Fact vs Opinion':['Distinguish verifiable statements from viewpoints or judgements.','This is essential for evaluating claims.','Check evidence, wording and certainty.','Better classification.'],'Claims & Generalisations':['Identify claims and notice when writers generalise beyond specific evidence.','Generalisations affect how broadly a statement can be applied.','Mark scope, quantifiers and supporting evidence.','More precise claim interpretation.'],'Qualification & Limitation':['Notice language that limits, narrows or qualifies a claim.','Academic and professional texts rarely mean everything absolutely.','Track hedges, conditions, exceptions and scope markers.','Accurate claim boundaries.'],'Evidence Status':['Judge what kind of support a statement has.','Not all evidence has equal force.','Identify data, example, expert view, anecdote and unsupported assertion.','Better evidence judgement.'],'Claim–Reason–Evidence':['Separate a claim from the reason and evidence supporting it.','This makes argument structure visible.','Map each claim to its reasoning and support.','Clear argument reconstruction.'],'Counterargument & Concession':['Recognise opposing views and how the writer responds to them.','Concession often strengthens a sophisticated argument.','Track contrast, concession, rebuttal and qualification.','Accurate argument mapping.'],'Evidence Quality':['Evaluate relevance, sufficiency and credibility of evidence.','Strong reading requires more than finding evidence.','Ask whether evidence is relevant, representative and reliable.','Better evidence evaluation.'],'Argument Structure':['Understand how claims, reasons, evidence and conclusions fit together.','Structure determines how an argument works.','Map the progression from premise to conclusion.','Independent argument reconstruction.'],'Assumptions':['Identify ideas a writer relies on without fully stating them.','Hidden assumptions can determine whether an argument works.','Ask what must be accepted for the claim to follow.','Critical awareness of assumptions.'],'Bias & Perspective':['Recognise how selection and viewpoint shape presentation.','Texts are constructed from perspectives.','Compare wording, omissions, framing and alternative views.','More balanced interpretation.'],'Credibility & Reliability':['Judge whether a source and its claims deserve trust.','Reliable reading matters beyond exams.','Consider source expertise, evidence, consistency and transparency.','Informed source judgement.'],'Comparing Sources':['Compare how different texts present the same issue.','Comparison exposes perspective, evidence and framing.','Track agreements, differences, omissions and emphasis.','Cross-source evaluation.'],'Summarising':['Condense key meaning while preserving the original message.','It demonstrates comprehension and supports knowledge building.','Select central ideas, remove redundancy and organise logically.','Accurate concise summary.'],'Paraphrasing':['Express the same meaning using different language and structure.','It supports comprehension and productive language use.','Change wording and structure while preserving meaning and register.','Faithful independent reformulation.'],'Cross-Text Synthesis':['Combine information from multiple texts into one coherent understanding.','Real-world reading often requires integration across sources.','Group common ideas, contrasts and complementary evidence.','Integrated cross-source understanding.'],'Note-taking & Knowledge Building':['Transform reading into organised notes that support later recall and use.','Good notes convert temporary input into usable knowledge.','Select, compress, categorise and connect important information.','Structured knowledge representation.'],'Transfer to Speaking & Writing':['Use reading input as a source for new spoken or written production.','Transfer turns comprehension into active language competence.','Reformulate ideas, evidence and vocabulary for a new communicative purpose.','Transferable language use.']};
const q=new URLSearchParams(location.search),skill=q.get('skill'),areaNo=q.get('area'),content=document.getElementById('content'),esc=s=>{const x=document.createElement('div');x.textContent=s;return x.innerHTML},norm=s=>(s||'').toLowerCase().replace(/[^a-z0-9]+/g,''),area=A.find(a=>a[0]===areaNo)||A.find(a=>a[2].some(s=>norm(s)===norm(skill)));
function areaView(a){document.getElementById('title').textContent=a[0]+' · '+a[1];document.getElementById('intro').textContent='Reading → Area → Sub-skills → Micro-skills';content.innerHTML='<section class="context"><span class="badge">READING AREA '+a[0]+'</span><h2>'+esc(a[1])+'</h2><p class="note">'+esc(a[3])+'</p><div class="info"><div><b>WHAT THIS AREA TEACHES</b><span>'+esc(a[3])+'</span></div><div><b>LEARNING ROUTE</b><span>Area → Sub-skill → Micro-skill → Learning Detail</span></div></div></section><section class="detail"><h3>Sub-skills</h3>'+a[2].map((s,i)=>'<a class="card" href="reading-area.html?skill='+encodeURIComponent(s)+'"><b>'+a[0]+'.'+(i+1)+'</b><h3>'+esc(s)+'</h3><p>'+esc((D[s]||['A teachable ability inside this area.'])[0])+'</p><small>OPEN SUB-SKILL →</small></a>').join('')+'</section>'}
function skillView(a,s){const idx=a[2].findIndex(x=>norm(x)===norm(s)),d=D[s]||['A specific teachable ability within '+a[1]+'.','It contributes directly to successful reading comprehension.','Notice, practise and apply the skill in authentic texts.','Reliable independent performance.'];document.getElementById('title').textContent=s;document.getElementById('intro').textContent='Reading → '+a[1]+' → '+s+' → Micro-skills';content.innerHTML='<section class="context"><span class="badge">READING AREA '+a[0]+'</span><h2>'+esc(a[1])+'</h2><p class="note">'+esc(a[3])+'</p><div class="info"><div><b>AREA PURPOSE</b><span>'+esc(a[3])+'</span></div><div><b>YOUR POSITION</b><span>Area '+a[0]+' → Sub-skill '+(idx+1)+'</span></div></div></section><section class="detail"><span class="badge">SUB-SKILL '+a[0]+'.'+(idx+1)+'</span><h2>'+esc(s)+'</h2><div class="info"><div><b>WHAT IS IT?</b><span>'+esc(d[0])+'</span></div><div><b>WHY DOES IT MATTER?</b><span>'+esc(d[1])+'</span></div><div><b>WHAT DO YOU DO?</b><span>'+esc(d[2])+'</span></div><div><b>LEARNING OUTCOME</b><span>'+esc(d[3])+'</span></div></div><div class="micro-head"><h3>MICRO-SKILLS</h3><a class="master-link" href="reading-micro-skills.html">Open Full Micro-Skills Map</a></div><div id="micro" class="micro"><p>Loading…</p></div><a class="pill" href="reading-area.html?area='+a[0]+'">← Back to '+esc(a[1])+'</a></section>';fetch('https://raw.githubusercontent.com/don223871-ui/LANGUAGE-HUB--LEARNING/main/READING_MICRO_SKILLS_MASTER.md').then(r=>r.text()).then(md=>{let active=false,items=[];md.split('\n').forEach(line=>{if(line.startsWith('## ')){active=norm(line.slice(3))===norm(s);return}if(active&&line.startsWith('- **')){const m=line.match(/^- \*\*(.*?)\*\*\s*[—-]\s*(.*)$/);if(m)items.push(m)}});const box=document.getElementById('micro');box.innerHTML=items.length?items.map((m,i)=>'<a class="micro-card" href="reading-micro-detail.html?skill='+encodeURIComponent(s)+'&micro='+encodeURIComponent(m[1])+'"><b>MICRO '+(i+1)+' · '+esc(m[1])+'</b><span>'+esc(m[2])+'</span><br><small>OPEN MICRO-SKILL DETAIL →</small></a>').join(''):'<a class="master-link" href="reading-micro-skills.html">Open Full Micro-Skills Map</a>'}).catch(()=>document.getElementById('micro').innerHTML='<a class="master-link" href="reading-micro-skills.html">Open Full Micro-Skills Map</a>')}
if(!area){content.innerHTML='<section class="detail"><h2>Reading</h2><p>Please enter through the Reading Master Map.</p></section>'}else if(skill){skillView(area,skill)}else{areaView(area)}
