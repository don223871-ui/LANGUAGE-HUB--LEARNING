<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading · Drill Down</title><link rel="stylesheet" href="style.css"><style>.wrap{max-width:1050px;margin:auto;padding:28px 20px 150px}.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 5px 18px #0000000a}.card:hover,.micro-card:hover{transform:translateY(-2px)}.detail{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:26px}.badge{display:inline-block;font-size:.72rem;letter-spacing:.08em;font-weight:800;padding:6px 10px;border-radius:999px;border:1px solid #ddd;margin-bottom:10px}.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:22px 0}.info div{padding:15px;border:1px solid #e5e7eb;border-radius:14px}.info b{display:block;margin-bottom:7px}.micro{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:18px}.micro-card{display:block;text-decoration:none;color:inherit;padding:16px;border:1px solid #e5e7eb;border-radius:14px}.micro-card b{display:block;margin-bottom:6px}.crumb{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}.back,.pill{display:inline-block;margin:12px 6px 0 0;padding:9px 13px;border-radius:999px;border:1px solid #ddd;text-decoration:none;color:inherit}.micro-empty{display:flex;justify-content:center;margin-top:18px}.master-link{display:inline-block;text-decoration:none;padding:11px 17px;border-radius:999px;border:1px solid #ddd;font-weight:700}.floating-nav{position:fixed;right:18px;bottom:18px;display:flex;gap:8px;z-index:20}.float-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;text-decoration:none;background:#fff;border:1px solid #ddd;box-shadow:0 6px 20px #0002}.nav-divider{width:1px;height:30px;background:#ccc;margin:auto 2px}.note{line-height:1.7}</style></head><body><header class="page-hero"><div class="page-hero-inner"><div class="brand-mark">mb</div><p class="eyebrow">LANGUAGE SKILLS · READING</p><h1 id="title">Reading</h1><p class="intro" id="intro">Area → Sub-skill → Micro-skill</p></div></header><main class="wrap"><a class="back" href="reading.html">← Reading Master Map</a><section id="content"></section></main><nav class="floating-nav"><a class="float-btn" href="index.html">mb</a><a class="float-btn" href="index.html">⌂</a><a class="float-btn" href="skills.html">📚</a><a class="float-btn" href="systems.html">⚙️</a><a class="float-btn" href="competence.html">🎯</a><span class="nav-divider"></span><a class="float-btn" href="reading.html">‹</a><a class="float-btn" href="listening.html">›</a></nav><script>
const areas=[['01','Reading Foundations',['Word Recognition','Word Segmentation','Sentence Processing','Reading Fluency']],['02','Literal Comprehension',['Locating Explicit Information','Specific Details','Following Instructions','Matching Information']],['03','Main Idea & Gist',['Topic Identification','Main Idea','Gist Summarising','Paragraph Main Point']],['04','Supporting Details',['Examples & Illustrations','Reasons & Explanations','Evidence & Data','Detail Relevance']],['05','Skimming',['Text Preview','Paragraph Skimming','Structural Skimming','Global Gist']],['06','Scanning',['Target Identification','Keyword & Synonym Search','Number/Name Scanning','Verification']],['07','Vocabulary in Context',['Context Clues','Collocation & Semantic Relations','Word Families','Register & Connotation']],['08','Inference & Implication',['Combining Clues','Meaning Inference','Writer Attitude Inference','Implication','Inference vs Fact']],['09','Reference & Cohesion',['Pronoun Reference','Lexical Reference','Linking Devices','Lexical Cohesion']],['10','Text Organisation',['Paragraph Structure','Text Patterns','Information Flow','Sentence/Paragraph Function']],['11',"Writer's Purpose",['Communicative Purpose','Audience Awareness','Genre Recognition','Purpose & Language Choice']],['12','Tone, Attitude & Stance',['Tone','Attitude','Stance & Certainty','Evaluation']],['13','Fact, Opinion & Claim',['Fact vs Opinion','Claims & Generalisations','Qualification & Limitation','Evidence Status']],['14','Argument & Evidence',['Claim–Reason–Evidence','Counterargument & Concession','Evidence Quality','Argument Structure']],['15','Critical Reading',['Assumptions','Bias & Perspective','Credibility & Reliability','Comparing Sources']],['16','Response & Synthesis',['Summarising','Paraphrasing','Cross-Text Synthesis','Note-taking & Knowledge Building','Transfer to Speaking & Writing']]];
const details={
'Word Recognition':['Recognise written words accurately and increasingly automatically.','Build fast, reliable access to word forms so attention can move from decoding individual words to meaning.','Notice spelling patterns, word families, morphology and multiword units; practise recognition in authentic text.','Accurate and increasingly automatic recognition of familiar and newly encountered written forms.'],
'Word Segmentation':['Identify where one written word ends and another begins, especially in dense or unfamiliar text.','Clear word boundaries support accurate parsing, vocabulary recognition and sentence comprehension.','Mark word boundaries, analyse unfamiliar strings and use syntax and morphology to confirm segmentation.','More accurate parsing of continuous written language.'],
'Sentence Processing':['Construct meaning from words by recognising grammatical relationships inside a sentence.','Efficient sentence processing prevents local grammar from blocking global comprehension.','Identify subjects, verbs, objects, modifiers, clauses and logical relationships while reading.','Accurate interpretation of sentence-level meaning and structure.'],
'Reading Fluency':['Read connected text with appropriate accuracy, pace, phrasing and attention to meaning.','Fluency reduces unnecessary cognitive load and supports deeper comprehension.','Practise repeated reading, phrase grouping, pacing and meaning-focused reading.','Smoother reading with fewer disruptive pauses and stronger comprehension.'],
'Locating Explicit Information':['Find information that the writer states directly.','It is the foundation for reliable detail comprehension and evidence retrieval.','Identify the target, locate its textual match and verify the exact wording or meaning.','Accurate retrieval of explicitly stated information.'],
'Specific Details':['Identify precise facts, examples, numbers, names, reasons or conditions in a text.','Detail accuracy matters when a question or task depends on one exact piece of information.','Search for target information, distinguish relevant from nearby distractors and verify context.','Reliable extraction of relevant details.'],
'Following Instructions':['Understand and follow written directions, sequences, conditions and constraints.','This converts reading from passive understanding into successful task completion.','Identify action verbs, order, conditions, exceptions and required outputs.','Correct completion of written instructions.'],
'Matching Information':['Connect information in questions, notes or statements with the correct part of a text.','It develops flexible retrieval beyond simple word matching.','Compare meaning, paraphrase, synonyms and discourse context before selecting a match.','Accurate meaning-based matching.'],
'Topic Identification':['Identify the subject a sentence, paragraph or text is about.','Topic recognition provides the first anchor for understanding main ideas.','Ask what the text is about, track repeated concepts and distinguish topic from detail.','Clear identification of the central subject.'],
'Main Idea':['Identify the central message or controlling point of a paragraph or text.','Main-idea control prevents over-focusing on individual details.','Compare candidate statements with the whole paragraph and reject overly narrow or broad options.','Accurate recognition of central meaning.'],
'Gist Summarising':['Construct a brief statement of overall meaning without reproducing unnecessary detail.','Gist is essential for efficient reading and later synthesis.','Combine topic, main point and key development into a concise statement.','A concise, faithful representation of overall meaning.'],
'Paragraph Main Point':['Identify what a paragraph contributes to the development of the text.','Paragraph-level control makes longer texts easier to navigate.','Notice topic sentences, development, examples, contrast and concluding statements.','Clear understanding of each paragraph’s communicative role.'],
'Examples & Illustrations':['Recognise examples and illustrations and understand what they demonstrate.','Examples often support a broader claim rather than being the main point themselves.','Connect an example to the idea it supports and distinguish illustration from independent evidence.','Accurate interpretation of examples as supporting material.'],
'Reasons & Explanations':['Identify why something happens or how a claim is explained.','Understanding explanatory relationships improves logical comprehension.','Track cause, reason, explanation and consequence markers.','Reliable recognition of explanatory relationships.'],
'Evidence & Data':['Interpret facts, statistics, quotations and other evidence used to support information or claims.','Evidence often changes the strength and meaning of an argument.','Identify what the evidence shows, what it supports and what it does not prove.','More precise evidence-based comprehension.'],
'Detail Relevance':['Judge whether a detail is relevant to the point being discussed.','This prevents distractors and interesting but irrelevant information from controlling interpretation.','Connect details to the paragraph purpose and central claim.','Better selection of relevant textual information.'],
'Skimming':['Read selectively to establish overall meaning, structure and important points quickly.','Skimming improves efficiency when complete reading is unnecessary at the first pass.','Preview title, headings, opening lines, paragraph shape and key lexical signals.','Fast orientation to a text before deeper reading.'],
'Scanning':['Search a text efficiently for a specific piece of information.','Scanning saves time when the target is known.','Predict likely forms, search for keywords and synonyms, then verify the surrounding context.','Fast and accurate retrieval of target information.'],
'Context Clues':['Use surrounding language to infer the meaning of an unfamiliar word or phrase.','Context-based vocabulary work develops independent reading ability.','Use definitions, examples, contrast, cause, grammar and semantic relationships around the item.','More confident vocabulary inference without immediate dictionary dependence.'],
'Inference & Implication':['Construct meaning that is suggested rather than directly stated.','Authentic texts frequently require readers to combine clues rather than retrieve one sentence.','Combine textual evidence with logical relationships while distinguishing inference from speculation.','Evidence-based interpretation of implied meaning.'],
'Tone':['Recognise the emotional or evaluative quality of a writer’s language.','Tone helps readers interpret how information is presented.','Notice evaluative vocabulary, modality, intensity, figurative language and framing.','More accurate interpretation of textual tone.'],
'Critical Reading':['Evaluate how a text constructs meaning, claims and perspective rather than simply accepting its surface message.','Critical reading supports academic, professional and real-world judgement.','Question assumptions, evidence, bias, source reliability and alternative interpretations.','Independent, evidence-based evaluation of texts.']};
const q=new URLSearchParams(location.search),skill=q.get('skill'),areaNo=q.get('area'),content=document.getElementById('content');const esc=s=>{const x=document.createElement('div');x.textContent=s;return x.innerHTML};const norm=s=>(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'');const area=areas.find(a=>a[0]===areaNo)||areas.find(a=>a[2].some(s=>norm(s)===norm(skill)));
function areaView(a){document.getElementById('title').textContent=a[0]+' · '+a[1];document.getElementById('intro').textContent='Reading → Area → choose a Sub-skill → Micro-skills';content.innerHTML='<section class="detail"><div class="crumb">READING · AREA '+a[0]+'</div><h2>'+esc(a[1])+'</h2><p>Choose a Sub-skill. Each one opens its own learning detail and Micro-skill layer.</p>'+a[2].map((s,i)=>'<a class="card" href="reading-area.html?skill='+encodeURIComponent(s)+'"><b>'+a[0]+'.'+(i+1)+'</b><h3>'+esc(s)+'</h3><p>Open → Sub-skill details + Micro-skills</p></a>').join('')+'</section>'}
function skillView(a,s){const idx=a[2].indexOf(s),d=details[s]||['Develop this reading ability in context.','Understand why it matters for comprehension and transferable reading performance.','Notice, practise and apply the skill in authentic texts.','Reliable performance that transfers to further reading tasks.'];document.getElementById('title').textContent=s;document.getElementById('intro').textContent='Reading → '+a[1]+' → '+s;content.innerHTML='<section class="detail"><div class="crumb">READING · AREA '+a[0]+' · SUB-SKILL '+a[0]+'.'+(idx+1)+'</div><span class="badge">MICRO-SKILLS</span><h2>'+esc(s)+'</h2><div class="info"><div><b>WHAT IS IT?</b><span>'+esc(d[0])+'</span></div><div><b>WHY DOES IT MATTER?</b><span>'+esc(d[1])+'</span></div><div><b>WHAT DO YOU DO?</b><span>'+esc(d[2])+'</span></div><div><b>LEARNING OUTCOME</b><span>'+esc(d[3])+'</span></div></div><h3>Micro-skills inside this Sub-skill</h3><div id="micro" class="micro"></div><a class="pill" href="reading-area.html?area='+a[0]+'">← Back to '+esc(a[1])+'</a><a class="master-link" href="reading-micro-skills.html">Open Full Micro-Skills Map</a></section>';fetch('https://raw.githubusercontent.com/don223871-ui/LANGUAGE-HUB--LEARNING/main/READING_MICRO_SKILLS_MASTER.md').then(r=>r.text()).then(md=>{const lines=md.split('\n');let active=false,items=[];for(const line of lines){if(line.startsWith('## ')){active=norm(line.slice(3))===norm(s);continue}if(active&&line.startsWith('- **')){const m=line.match(/^- \*\*(.*?)\*\*\s*[—-]\s*(.*)$/);if(m)items.push(m)}else if(active&&line.startsWith('# '))break}const box=document.getElementById('micro');box.innerHTML=items.length?items.map((m,i)=>'<a class="micro-card" href="reading-micro-detail.html?skill='+encodeURIComponent(s)+'&micro='+encodeURIComponent(m[1])+'"><b>'+esc(m[1])+'</b><span>'+esc(m[2])+'</span><br><small>OPEN MICRO-SKILL →</small></a>').join(''):'<div class="micro-empty"><a class="master-link" href="reading-micro-skills.html">Open Full Micro-Skills Map</a></div>'}).catch(()=>document.getElementById('micro').innerHTML='<div class="micro-empty"><a class="master-link" href="reading-micro-skills.html">Open Full Micro-Skills Map</a></div>')}
if(!area){content.innerHTML='<section class="detail"><h2>Reading</h2><p>Please enter through the Reading Master Map.</p></section>'}else if(skill){skillView(area,skill)}else{areaView(area)}
</script></body></html>
